[package]
name = "aanote"
version = "0.1.0"
description = "Terminal-aesthetic markdown notes"
authors = ["pk"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
keyring = "2"
filetime = "0.2"
reqwest = { version = "0.11", features = ["json", "multipart"] }
# tokio features: rt-multi-thread + macros (async runtime + #[tauri::command]),
# time (sync timeout in gdrive_login), and the blocking task spawn for the
# loopback listener. Trimmed from "full" to reduce binary bloat (D3).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
